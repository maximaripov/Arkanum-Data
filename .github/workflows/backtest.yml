name: Signal backtest (owner-only)
# Run by hand: scores past insider buys with the site's formula and measures what happened
# next. Writes docs/backtest/ (the papers' results) and public/data/lab/buys-2023-25.json (the
# research lab's table); with lab_only, just the lab table.
on:
  workflow_dispatch:
    inputs:
      from: { description: "First quarter scored", default: "2023q1" }
      to: { description: "Last quarter scored", default: "2025q4" }
      history: { description: "History starts (for 'first buy in N years')", default: "2020q1" }
      publish: { description: "Commit the results (they feed the site). Off: results only in the run log.", type: boolean, default: true }
      lab_only: { description: "Only (re)build the research lab table (public/data/lab), leaving the papers' results untouched", type: boolean, default: false }
      lab_file: { description: "Lab table to write (buys-2023-25.json; buys-2026.json with from 2026q1)", default: "buys-2023-25.json" }
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backtest
        env:
          LAB_FILE: ${{ inputs.lab_file }}
        run: |
          case "$LAB_FILE" in buys-*.json) ;; *) echo "lab_file must look like buys-2026.json"; exit 1;; esac
          mkdir -p public/data/lab
          node scripts/backtest.mjs --from "${{ inputs.from }}" --to "${{ inputs.to }}" --history-from "${{ inputs.history }}" ${{ (!inputs.publish || inputs.lab_only) && '--out /tmp/out' || '' }} --lab "public/data/lab/$LAB_FILE"
      - name: Results to the log (not published)
        if: ${{ !inputs.publish || inputs.lab_only }}
        run: |
          cat /tmp/out/results.md
          echo RESULT_JSON_START; cat /tmp/out/results.json; echo; echo RESULT_JSON_END
      - name: Commit results
        if: ${{ inputs.publish }}
        run: |
          git config user.name "maximaripov"
          git config user.email "351230404+maximaripov@users.noreply.github.com"
          ${{ inputs.lab_only && 'git add public/data/lab' || 'git add docs/backtest public/data/lab' }}
          git diff --cached --quiet && exit 0
          git commit -m "${{ inputs.lab_only && 'data: research lab table' || 'Backtest results' }} $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
