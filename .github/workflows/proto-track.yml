name: Prototype - insider track record
# Throwaway branch only: computes the track-record prototype and uploads the result.
on:
  push:
    branches: [proto-track]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/proto-track.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: track-result
          path: scripts/result.json
