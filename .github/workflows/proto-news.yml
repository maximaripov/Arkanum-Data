name: Prototype - private investments from news
# Throwaway branch only: tests picking investments out of news headlines (GDELT).
on:
  push:
    branches: [proto-news]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/proto-news.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: news-result
          path: scripts/news-result.json
