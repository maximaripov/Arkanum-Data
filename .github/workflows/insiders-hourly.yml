name: Hourly insider trades
# Weekdays from about 7 AM to 11 PM New York time (when executives file): pick up new
# Form 4 filings from SEC EDGAR's live feed, publish today's trades, and send instant
# alerts to watchlists. About 2 minutes a run; well within GitHub's free monthly minutes.
# Times are UTC: 11:17-23:17 Mon-Fri, then 00:17-03:17 Tue-Sat (the US evening before).
on:
  schedule:
    - cron: "17 11-23 * * 1-5"
    - cron: "17 0-3 * * 2-6"
  workflow_dispatch:
    inputs:
      test_failure:
        description: "Fail on purpose to test the failure and recovery alerts (changes no data)"
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write # lets the job prove to the site that it is this repo's job
  actions: read # to check how the previous run ended before alerting
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SITE_URL: https://form4-insiders.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: simulate
        name: Simulated failure (test run only)
        if: github.event_name == 'workflow_dispatch' && inputs.test_failure
        run: |
          echo "Failing on purpose to test the alerts."
          exit 1
      - id: install
        run: npm ci
      - id: today
        name: Today's insider trades (SEC Form 4 live feed)
        run: NEW_TRADES_OUT="$RUNNER_TEMP/new-trades.json" node scripts/build-insiders-today.mjs
      # Private investments announced in press releases (Stakes page). Feeds only show their
      # latest items, hence hourly. Best effort: a feed outage doesn't fail the job or alert.
      - name: Private investments (press releases)
        continue-on-error: true
        run: node scripts/build-private.mjs
      # The home page's small summary file; if this fails the page computes it itself.
      - name: Insiders overview
        continue-on-error: true
        run: node scripts/build-overview.mjs
      - id: commit
        name: Commit data
        run: |
          # Vercel's Hobby plan only deploys commits authored by the project owner.
          git config user.name "maximaripov"
          git config user.email "351230404+maximaripov@users.noreply.github.com"
          git add public/data/insiders-today.json public/data/private.json public/data/overview.json data
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "data: insider trades $(date -u +%FT%H:%MZ)"
          # The daily job may have pushed meanwhile; on the shared history cache, keep ours.
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
          exit 1
      - id: alerts
        name: Instant alerts
        run: NEW_TRADES_OUT="$RUNNER_TEMP/new-trades.json" node scripts/instant-alerts.mjs
      # Tell the owner's devices when the job breaks, and when it works again. Only on a
      # change from the previous run, so a lasting outage sends one message, not one an hour.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "${{ github.repository }}" --workflow insiders-hourly.yml --limit 5 --json databaseId,conclusion,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .status == "completed")][0].conclusion' || echo "")
          if [ "$prev" = "failure" ]; then echo "The previous run failed too; the owner was already alerted."; exit 0; fi
          failed=""
          [ "${{ steps.simulate.outcome }}" = "failure" ] && failed="$failed a deliberate test (nothing is actually wrong),"
          [ "${{ steps.install.outcome }}" = "failure" ] && failed="$failed setup,"
          [ "${{ steps.today.outcome }}" = "failure" ] && failed="$failed reading new filings from SEC,"
          [ "${{ steps.commit.outcome }}" = "failure" ] && failed="$failed saving the data,"
          [ "${{ steps.alerts.outcome }}" = "failure" ] && failed="$failed instant alerts,"
          failed="${failed%,}"
          node scripts/notify.mjs "Form4: hourly insider update failed" "Failed:${failed:- setup}. The site keeps the last good data; you'll hear once it works again. Details in GitHub Actions." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Notify on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh run list --repo "${{ github.repository }}" --workflow insiders-hourly.yml --limit 5 --json databaseId,conclusion,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .status == "completed")][0].conclusion' || echo "")
          if [ "$prev" = "failure" ]; then
            node scripts/notify.mjs "Form4: hourly insider update is working again" "The latest run succeeded." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
