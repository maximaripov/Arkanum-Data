name: Market close briefing and data
# Weekdays at 4:02 PM New York time: refresh prices, send the daily briefing to your
# phone, then refresh insider trades and commit the data (Vercel redeploys on commit).
#
# GitHub schedules run in UTC, and 4 PM in New York is 21:02 UTC in winter (EST) but
# 20:02 UTC in summer (EDT). Both are scheduled; the gate job keeps the one that is
# 4 PM in New York today. GitHub often starts scheduled runs a few minutes late.
on:
  schedule:
    - cron: "2 21 * * 1-5" # 4:02 PM EST (winter)
    - cron: "2 20 * * 1-5" # 4:02 PM EDT (summer)
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the briefing notification to your phone"
        type: boolean
        default: true
      test_alert:
        description: "Also send a test of the failure alert"
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write # lets the briefing step prove to the site that it is this repo's job
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          # -0500 in winter → the 21:02 UTC schedule is 4 PM; -0400 in summer → 20:02 UTC.
          offset=$(TZ=America/New_York date +%z)
          if [ "$offset" = "-0500" ]; then want="2 21 * * 1-5"; else want="2 20 * * 1-5"; fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 4 PM in New York for this schedule; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test failure alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        env:
          SITE_URL: https://foresightscreener.vercel.app
        run: |
          node scripts/notify.mjs "Foresight: test alert" "This is a test. If a 4 PM update ever fails, you'll get a message like this naming the step." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # Closing prices first: the briefing's market breadth and movers come from them.
      - id: screener
        name: Build screener (closing prices + SEC fundamentals)
        run: node scripts/build-screener.mjs
      - id: check_screener
        name: Check screener data
        run: node scripts/health-check.mjs screener
      - id: briefing
        name: Send daily briefing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SITE_URL: https://foresightscreener.vercel.app
        run: node scripts/daily-briefing.mjs ${{ github.event_name == 'workflow_dispatch' && !inputs.notify && '--no-push' || '' }}
      - id: insiders
        name: Update insider trades
        run: node scripts/build-insiders.mjs --days 30
      - id: dividends
        name: Update dividend calendar
        run: node scripts/build-dividends.mjs
      - id: funds
        name: Update big-fund holdings (13F)
        run: node scripts/build-funds.mjs
      - id: check_all
        name: Check all data before publishing
        run: node scripts/health-check.mjs all
      - name: Commit data
        run: |
          # Vercel's Hobby plan only deploys commits authored by the project owner,
          # so the bot commits as the owner's GitHub no-reply identity.
          git config user.name "maximaripov"
          git config user.email "351230404+maximaripov@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "data: market close refresh $(date -u +%F)"
          git push
      # Health check: if any step failed, nothing above was published (the site keeps
      # the last good data) and you get a notification saying which step broke.
      - name: Notify on failure
        if: failure()
        env:
          SITE_URL: https://foresightscreener.vercel.app
        run: |
          failed=""
          [ "${{ steps.screener.outcome }}" = "failure" ] && failed="$failed screener prices/fundamentals,"
          [ "${{ steps.check_screener.outcome }}" = "failure" ] && failed="$failed screener data check,"
          [ "${{ steps.briefing.outcome }}" = "failure" ] && failed="$failed daily briefing,"
          [ "${{ steps.insiders.outcome }}" = "failure" ] && failed="$failed insider trades,"
          [ "${{ steps.dividends.outcome }}" = "failure" ] && failed="$failed dividend calendar,"
          [ "${{ steps.funds.outcome }}" = "failure" ] && failed="$failed big-fund holdings,"
          [ "${{ steps.check_all.outcome }}" = "failure" ] && failed="$failed data check,"
          failed="${failed%,}"
          node scripts/notify.mjs "Foresight: 4 PM update failed" "Failed:${failed:- setup}. The site keeps yesterday's data. Details in GitHub Actions." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
