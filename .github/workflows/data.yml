name: Daily digest and data
# Weekdays at 4:02 PM New York time: rebuild the SEC-based data (fundamentals, the 30-day
# insider file and each buy's history, 13F fund holdings) and the economic calendar, check it, send each subscribed
# device its digest, then commit the data (Vercel redeploys on commit). Today's insider
# trades are added hourly by insiders-hourly.yml.
#
# GitHub schedules run in UTC, and 4 PM in New York is 21:02 UTC in winter (EST) but
# 20:02 UTC in summer (EDT). Both are scheduled; the gate job keeps the one that is
# 4 PM in New York today. GitHub often starts scheduled runs a few minutes late.
on:
  schedule:
    - cron: "2 21 * * 1-5" # 4:02 PM EST (winter)
    - cron: "2 20 * * 1-5" # 4:02 PM EDT (summer)
  workflow_dispatch:
    inputs:
      notify:
        description: "Send the digest notification to subscribed devices"
        type: boolean
        default: true
      test_alert:
        description: "Also send a test of the failure alert (owner devices only)"
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write # lets the job prove to the site that it is this repo's job
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          # -0500 in winter → the 21:02 UTC schedule is 4 PM; -0400 in summer → 20:02 UTC.
          offset=$(TZ=America/New_York date +%z)
          if [ "$offset" = "-0500" ]; then want="2 21 * * 1-5"; else want="2 20 * * 1-5"; fi
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ github.event.schedule }}" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 4 PM in New York for this schedule; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150 # a full 30-day insider rebuild takes about an hour; normal runs ~2 min
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SITE_URL: https://arkanumdata.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test failure alert
        if: github.event_name == 'workflow_dispatch' && inputs.test_alert
        run: |
          node scripts/notify.mjs "Arkanum: test alert" "This is a test. If a daily update ever fails, you'll get a message like this naming the step." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - id: screener
        name: Build screener (SEC fundamentals)
        run: node scripts/build-screener.mjs
      - id: insiders
        name: Update insider trades (SEC Form 4)
        run: node scripts/build-insiders.mjs --days 30
      - name: Insiders overview (home page summary)
        continue-on-error: true
        run: node scripts/build-overview.mjs
      - name: Insider directory (search)
        continue-on-error: true
        run: node scripts/build-people.mjs
      # Wikidata CEOs/chairs matched to Form 4 filers, ranked by Wikipedia views; then the
      # directory again so search knows their common names ("Jensen Huang").
      - name: Well-known insiders (Wikipedia views)
        continue-on-error: true
        run: node scripts/build-famous.mjs && node scripts/build-people.mjs
      - id: funds
        name: Update big-fund holdings (SEC 13F)
        run: node scripts/build-funds.mjs
      - id: events
        name: Update economic calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/build-events.mjs
      # The hourly job only sees each feed's latest 20 items and doesn't run overnight or
      # on weekends; PR Newswire's news sitemap lists the last ~2 days, so this fills gaps.
      - name: Private investments missed by the hourly feeds
        continue-on-error: true
        run: node scripts/backfill-private.mjs --since "$(date -u -d '3 days ago' +%F)"
      - id: check_all
        name: Check all data before sending or publishing
        run: node scripts/health-check.mjs all
      - id: digest
        name: Send daily digest
        run: node scripts/daily-digest.mjs ${{ github.event_name == 'workflow_dispatch' && !inputs.notify && '--no-push' || '' }}
      - name: Commit data
        run: |
          # Vercel's Hobby plan only deploys commits authored by the project owner,
          # so the bot commits as the owner's GitHub no-reply identity.
          git config user.name "maximaripov"
          git config user.email "351230404+maximaripov@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "data: daily refresh $(date -u +%F)"
          # The hourly insider job may have pushed meanwhile; on the shared history cache, keep ours.
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
          exit 1
      # If any step failed, nothing was sent or published (the site keeps the last good
      # data) and the owner's devices get a notification naming the step.
      - name: Notify on failure
        if: failure()
        run: |
          failed=""
          [ "${{ steps.screener.outcome }}" = "failure" ] && failed="$failed SEC fundamentals,"
          [ "${{ steps.insiders.outcome }}" = "failure" ] && failed="$failed insider trades,"
          [ "${{ steps.funds.outcome }}" = "failure" ] && failed="$failed big-fund holdings,"
          [ "${{ steps.events.outcome }}" = "failure" ] && failed="$failed economic calendar,"
          [ "${{ steps.check_all.outcome }}" = "failure" ] && failed="$failed data check,"
          [ "${{ steps.digest.outcome }}" = "failure" ] && failed="$failed digest,"
          failed="${failed%,}"
          node scripts/notify.mjs "Arkanum: daily update failed" "Failed:${failed:- setup}. The site keeps the last good data. Details in GitHub Actions." "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
