name: Nightly market data
# Rebuilds the screener (prices + SEC fundamentals) and the 30-day insider-trade file,
# then commits them. Vercel redeploys on the commit, so the site picks them up.
on:
  schedule:
    - cron: "17 23 * * 1-5" # 23:17 UTC on weekdays, after the US close
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-screener.mjs
      - run: node scripts/build-insiders.mjs --days 30
      - name: Commit data
        run: |
          git config user.name "foresight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "data: nightly refresh $(date -u +%F)"
          git push
