name: Nightly market data
# Rebuilds the screener (prices + SEC fundamentals) and the 30-day insider-trade file,
# then commits them. Vercel redeploys on the commit, so the site picks them up.
on:
  schedule:
    - cron: "17 23 * * 1-5" # 23:17 UTC on weekdays, after the US close
  workflow_dispatch:
permissions:
  contents: write
  id-token: write # lets the briefing step prove to the site that it is this repo's job
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-screener.mjs
      - run: node scripts/build-insiders.mjs --days 30
      - name: Commit data
        run: |
          # Vercel's Hobby plan only deploys commits authored by the project owner,
          # so the bot commits as the owner's GitHub no-reply identity.
          git config user.name "maximaripov"
          git config user.email "351230404+maximaripov@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || git commit -m "data: nightly refresh $(date -u +%F)"
          git push
      - name: Send daily briefing
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SITE_URL: https://foresightscreener.vercel.app
        run: node scripts/daily-briefing.mjs
