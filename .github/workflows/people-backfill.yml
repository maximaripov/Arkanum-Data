name: Insider directory backfill
# Run by hand (once, or after a long gap): adds everyone with an open-market trade the site
# would show in the last two years to the insider search, from SEC's quarterly data sets.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: people-directory
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Backfill from SEC quarterly data sets
        run: node scripts/backfill-people.mjs
      - name: Rebuild the search list
        run: node scripts/build-people.mjs
      - name: Commit
        run: |
          git config user.name "maximaripov"
          git config user.email "351230404+maximaripov@users.noreply.github.com"
          git add data/people.json public/data/people.json
          git diff --cached --quiet && exit 0
          git commit -m "data: insider directory backfill $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
          exit 1
