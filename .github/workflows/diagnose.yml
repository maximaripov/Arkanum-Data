name: Diagnose (manual)
# Runs a read-only diagnostic script on GitHub, where SEC is reachable (it isn't from
# development sandboxes). Commits nothing.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script under scripts/diagnose/, e.g. fundamentals.mjs"
        required: true
        default: fundamentals.mjs
      args:
        description: "Arguments"
        required: false
        default: ""
permissions:
  contents: read
  id-token: write # lets price-fallback.mjs prove to the site that it is this repo's job
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci # some scripts need the repo's packages (e.g. fast-xml-parser for 13F)
      - name: Run
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
        run: |
          case "$SCRIPT" in *..*|/*) echo "bad script path"; exit 1;; esac
          node "scripts/diagnose/$SCRIPT" $ARGS
